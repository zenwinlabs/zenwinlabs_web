<!DOCTYPE html>
<!--
  ════════════════════════════════════════════════════════════════
  ZenWinLabs — BLOG LIST TEMPLATE  (one per app)
  ════════════════════════════════════════════════════════════════
  Shared look + behaviour come from /blog.css and /blog.js. This page
  only carries its own content; the top bar, theme toggle and footer are
  injected by blog.js from the data-* attributes on <body>.
  TO USE FOR A NEW APP:
    1. Copy to /apps/<app>/blog/index.html and replace every {{PLACEHOLDER}}.
    2. Create /apps/<app>/blog/posts.json (see the Habits example).
    3. Add posts from _blog-post-template.html — the list renders itself.
  ════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{APP NAME}} Blog — Guides & Tips | ZenWinLabs</title>
  <meta name="description" content="{{One-line description of this app's blog, ~150 chars.}}">
  <link rel="canonical" href="https://zenwinlabs.com/apps/{{app}}/blog/">
  <link rel="stylesheet" href="/blog.css">
  <script>(function(){try{var t=localStorage.getItem('zw-blog-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body data-app="{{app}}" data-app-name="{{APP NAME}}" data-app-url="{{PLAY_STORE_URL}}">

<section class="blog-hero">
  <div class="blog-narrow">
    <span class="eyebrow">{{APP NAME}} Blog</span>
    <h1>{{Blog headline}}</h1>
    <p class="lede">{{One or two sentences on what readers get here.}}</p>
  </div>
</section>

<section class="blog-list-wrap">
  <div class="blog-wrap">
    <div class="blog-grid" id="blog-list" data-posts="posts.json" data-base="/apps/{{app}}/blog/"></div>
  </div>
</section>

<script src="/blog.js"></script>
</body>
</html>
